version: "3.9"

services:
  resolvr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: resolvr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      RESOLVR_API_KEY: ${RESOLVR_API_KEY}
      RESOLVR_REQUIRE_CONFIRMATION: ${RESOLVR_REQUIRE_CONFIRMATION:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/q/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
