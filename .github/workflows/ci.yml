name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # The `resolvr` CLI (cli/) is a fully independent Maven module/build from the server
  # above — its own pom.xml, its own Maven wrapper, no shared reactor. This job runs in
  # parallel with `build` and cannot affect it either way.
  cli-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: cli/pom.xml

      - name: Make cli/mvnw executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x cli/mvnw

      - name: Build and test CLI (Unix)
        if: runner.os != 'Windows'
        working-directory: cli
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Build and test CLI (Windows)
        if: runner.os == 'Windows'
        working-directory: cli
        run: .\mvnw.cmd --batch-mode --no-transfer-progress test

  # Publishes a prebuilt image to GHCR on every push to main, once tests pass.
  # Lets anyone deploy resolvr (Docker/Koyeb/etc.) by pulling an image, without
  # cloning the repo or having a Java toolchain.
  publish-image:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=$(echo 'ghcr.io/${{ github.repository_owner }}/resolvr' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
