# ──────────────────────────────────────────────────────────────────────────────
# Resolvr — Quarkus MCP Server Configuration
# Copy this file and set real values via environment variables or .env file
# ──────────────────────────────────────────────────────────────────────────────

# ── GitHub credentials ────────────────────────────────────────────────────────
# Personal Access Token with: repo, read:discussion, write:discussion scopes
# Or use a GitHub App installation token.
# If left unset, falls back to `gh auth token` (the GitHub CLI's active session) —
# handy for local MCP use when you've already run `gh auth login`.
github.token=${GITHUB_TOKEN:your-token-here}

# HMAC secret set in your GitHub webhook configuration (leave blank to disable verification in dev)
github.webhook.secret=${GITHUB_WEBHOOK_SECRET:}

# Shared API key required (as `Authorization: Bearer <key>`) for every route except
# /webhook/github (HMAC-verified separately) and /q/health. Leave blank to disable —
# fine for localhost-only dev, NOT fine for anything reachable off your own machine:
# without a key, /mcp/sse and /webhook/trigger let anyone who can reach the port
# drive this server's GitHub token.
resolvr.api-key=${RESOLVR_API_KEY:}

# When true, apply_fix/auto_resolve_all stage fixes instead of committing them
# immediately — an explicit confirm_fix call is required before anything is written
# to GitHub. Off by default to preserve the original single-user workflow; turn this
# on for any deployment where you didn't personally write every fix being applied.
resolvr.require-confirmation=${RESOLVR_REQUIRE_CONFIRMATION:false}

# ── CI feedback loop (Phase 5) ──────────────────────────────────────────────────
# get_ci_failure_logs tail-truncates a failing check's log to this many lines
# (failures/stack traces are almost always near the end) before returning it.
resolvr.ci.log-max-lines=${RESOLVR_CI_LOG_MAX_LINES:300}

# Hard cap in bytes on top of the line cap, in case a single line is enormous
# (e.g. minified build output) — protects against oversized tool responses.
resolvr.ci.log-max-bytes=${RESOLVR_CI_LOG_MAX_BYTES:65536}

# ── Server ────────────────────────────────────────────────────────────────────
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0

# ── MCP Server (SSE transport) ────────────────────────────────────────────────
# IDE connects to: http://localhost:8080/mcp/sse
quarkus.mcp.server.server-info.name=resolvr
quarkus.mcp.server.server-info.version=1.0.0

# ── Logging ───────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."com.resolvr".level=DEBUG
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{1.}] %s%e%n

# ── Dev mode: disable auth for local testing ──────────────────────────────────
%dev.github.webhook.secret=
%dev.resolvr.api-key=
%dev.quarkus.http.port=8080

# ── CORS (allow IDE extensions to connect) ────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type

# ── OpenAPI / Swagger UI ──────────────────────────────────────────────────────
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
